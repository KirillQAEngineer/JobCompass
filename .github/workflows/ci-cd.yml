name: JobCompass CI/CD

run-name: CI/CD • ${{ github.event_name }} • ${{ github.ref_name }}

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Deploy GitHub Pages after successful checks (main only)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"
  FLUTTER_CHANNEL: stable

jobs:
  java-api-tests:
    name: Java QA • REST Assured API
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: jobcompass_ci
          POSTGRES_USER: jobcompass
          POSTGRES_PASSWORD: jobcompass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobcompass -d jobcompass_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: apps/api
      DATABASE_URL: postgresql+psycopg://jobcompass:jobcompass@localhost:5432/jobcompass_ci
      DATABASE_URL_DOCKER: ""
      JDBC_DATABASE_URL: jdbc:postgresql://localhost:5432/jobcompass_ci
      DATABASE_USER: jobcompass
      DATABASE_PASSWORD: jobcompass
      API_BASE_URL: http://127.0.0.1:8000
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      ENVIRONMENT: test
      GEMINI_API_KEY: ""
      ADZUNA_APP_ID: ""
      ADZUNA_APP_KEY: ""
      JOOBLE_API_KEY: ""

    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: qa-tests/pom.xml

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r apps/api/requirements.txt

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Install security audit tools
        run: python -m pip install pip-audit==2.10.1 bandit==1.9.4

      - name: Audit backend dependencies and source
        run: |
          pip-audit -r apps/api/requirements.txt
          bandit -r apps/api/app -ll

      - name: Compile backend source
        run: python -m compileall -q apps/api/app apps/api/alembic/versions

      - name: Apply all Alembic migrations to PostgreSQL
        run: python -m alembic -c apps/api/alembic.ini upgrade head

      - name: Show active database migration
        run: python -m alembic -c apps/api/alembic.ini current

      - name: Start the tested API
        run: |
          mkdir -p reports
          python -m uvicorn app.main:app \
            --app-dir apps/api \
            --host 127.0.0.1 \
            --port 8000 \
            > reports/api.log 2>&1 &

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              cat reports/api.log
              exit 1
            fi

            sleep 1
          done

      - name: Run Java REST Assured tests
        run: >-
          mvn --batch-mode --no-transfer-progress
          --file qa-tests/pom.xml
          --activate-profiles api-tests
          test

      - name: Upload API and Allure reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-api-test-reports-${{ github.run_id }}
          path: |
            reports/
            qa-tests/target/surefire-reports/
            qa-tests/target/allure-results/
          if-no-files-found: warn
          retention-days: 7

  frontend-build:
    name: Frontend • Format, Analyze, Web build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Flutter dependencies
        working-directory: jobcompass_ui
        run: flutter pub get

      - name: Check Dart formatting
        working-directory: jobcompass_ui
        run: dart format --output=none --set-exit-if-changed lib

      - name: Run Flutter static analysis
        working-directory: jobcompass_ui
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Build production Flutter Web artifact
        working-directory: jobcompass_ui
        run: |
          flutter build web \
            --release \
            --base-href "/${GITHUB_REPOSITORY#*/}/" \
            --dart-define=API_BASE_URL="${API_BASE_URL:-http://localhost:8000}"
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}

      - name: Upload tested web application
        uses: actions/upload-artifact@v7
        with:
          name: web-app-${{ github.run_id }}
          path: jobcompass_ui/build/web/
          if-no-files-found: error
          retention-days: 7

  java-ui-tests:
    name: Java QA • Selenium UI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: jobcompass_ci
          POSTGRES_USER: jobcompass
          POSTGRES_PASSWORD: jobcompass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobcompass -d jobcompass_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: apps/api
      DATABASE_URL: postgresql+psycopg://jobcompass:jobcompass@localhost:5432/jobcompass_ci
      DATABASE_URL_DOCKER: ""
      JDBC_DATABASE_URL: jdbc:postgresql://localhost:5432/jobcompass_ci
      DATABASE_USER: jobcompass
      DATABASE_PASSWORD: jobcompass
      API_BASE_URL: http://127.0.0.1:8000
      WEB_BASE_URL: http://127.0.0.1:3000
      HEADLESS: "true"
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      ENVIRONMENT: test
      GEMINI_API_KEY: ""
      ADZUNA_APP_ID: ""
      ADZUNA_APP_KEY: ""
      JOOBLE_API_KEY: ""

    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: qa-tests/pom.xml

      - name: Install application dependencies
        run: |
          python -m pip install --disable-pip-version-check -r apps/api/requirements.txt
          flutter pub get --directory jobcompass_ui

      - name: Apply database migrations
        run: python -m alembic -c apps/api/alembic.ini upgrade head

      - name: Start API and wait for readiness
        run: |
          mkdir -p reports
          python -m uvicorn app.main:app \
            --app-dir apps/api \
            --host 127.0.0.1 \
            --port 8000 \
            > reports/ui-api.log 2>&1 &

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat reports/ui-api.log
          exit 1

      - name: Build local Flutter Web application
        working-directory: jobcompass_ui
        run: >-
          flutter build web
          --release
          --base-href "/"
          --dart-define=E2E_SEMANTICS_ENABLED=true
          --dart-define=API_BASE_URL="${API_BASE_URL}"

      - name: Start web application and wait for readiness
        run: |
          python -m http.server 3000 \
            --bind 127.0.0.1 \
            --directory jobcompass_ui/build/web \
            > reports/ui-web.log 2>&1 &

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat reports/ui-web.log
          exit 1

      - name: Run Java Selenium tests
        run: >-
          mvn --batch-mode --no-transfer-progress
          --file qa-tests/pom.xml
          --activate-profiles ui-tests
          test

      - name: Upload UI and Allure reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-ui-test-reports-${{ github.run_id }}
          path: |
            reports/
            qa-tests/target/surefire-reports/
            qa-tests/target/allure-results/
          if-no-files-found: warn
          retention-days: 7

  documentation:
    name: Documentation • Docusaurus build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install documentation dependencies
        working-directory: docs
        run: npm ci

      - name: Audit documentation dependencies
        working-directory: docs
        run: npm audit --audit-level=moderate

      - name: Build Docusaurus documentation
        working-directory: docs
        run: npm run build
        env:
          DOCS_BASE_URL: /${{ github.event.repository.name }}/docs/

      - name: Upload tested documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation-${{ github.run_id }}
          path: docs/build/
          if-no-files-found: error
          retention-days: 7

  package-api-image:
    name: Package • Docker API image
    needs:
      - java-api-tests
      - java-ui-tests
      - frontend-build
      - documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build backend Docker image
        run: |
          docker build \
            --file docker/api/Dockerfile \
            --tag "jobcompass-api:ci-${GITHUB_SHA::12}" \
            .

      - name: Inspect Docker image
        run: docker image inspect "jobcompass-api:ci-${GITHUB_SHA::12}"

  ci-passed:
    name: CI Passed
    if: always()
    needs:
      - java-api-tests
      - java-ui-tests
      - frontend-build
      - documentation
      - package-api-image
    runs-on: ubuntu-latest

    steps:
      - name: Verify every required stage
        env:
          API_TEST_RESULT: ${{ needs.java-api-tests.result }}
          UI_TEST_RESULT: ${{ needs.java-ui-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-build.result }}
          DOCS_RESULT: ${{ needs.documentation.result }}
          PACKAGE_RESULT: ${{ needs.package-api-image.result }}
        run: |
          failed=0

          for check in \
            "Java API:$API_TEST_RESULT" \
            "Java UI:$UI_TEST_RESULT" \
            "Frontend:$FRONTEND_RESULT" \
            "Documentation:$DOCS_RESULT" \
            "Docker:$PACKAGE_RESULT"; do
            name="${check%%:*}"
            result="${check#*:}"
            printf '%-16s %s\n' "$name" "$result"

            if [ "$result" != "success" ]; then
              failed=1
            fi
          done

          exit "$failed"

  assemble-pages:
    name: CD • Assemble GitHub Pages
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_pages)
    needs:
      - frontend-build
      - documentation
    runs-on: ubuntu-latest

    steps:
      - name: Download tested web application
        uses: actions/download-artifact@v8
        with:
          name: web-app-${{ github.run_id }}
          path: release/

      - name: Download tested documentation
        uses: actions/download-artifact@v8
        with:
          name: documentation-${{ github.run_id }}
          path: release/docs/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/

  deploy-pages:
    name: CD • Deploy GitHub Pages
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_pages)
    needs:
      - ci-passed
      - assemble-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
